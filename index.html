<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110f">
  <title>鹿鸣智域｜梅花鹿智慧养殖演示平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#app-main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M24 41c7-8 9-16 7-24M24 41c-7-8-9-16-7-24M18 19c-5-3-7-7-7-11M17 25c-6 0-10-2-13-6M30 19c5-3 7-7 7-11M31 25c6 0 10-2 13-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M18 28c2-4 10-4 12 0 2 5-1 11-6 13-5-2-8-8-6-13Z" fill="currentColor" opacity=".9"/>
          </svg>
        </div>
        <div>
          <strong>鹿鸣智域</strong>
          <span>DEER INTELLIGENCE</span>
        </div>
      </div>
      <button class="sidebar-collapse" data-action="toggle-sidebar" aria-label="收起导航栏" title="收起导航栏" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/><path d="M19 4v16"/></svg>
      </button>

      <div class="demo-stamp">
        <i></i>
        <div><b>模拟演示环境</b><span>非生产运行数据</span></div>
      </div>

      <nav class="nav-list" id="nav-list">
        <button class="nav-item active" data-view="dashboard" title="综合大屏">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span>综合大屏</span>
        </button>
        <div class="nav-section">业务中心</div>
        <button class="nav-item" data-view="production" title="生产工作台"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V9l8-5 8 5v12"/><path d="M8 21v-7h8v7M3 21h18"/></svg></span><span>生产工作台</span><em>12</em></button>
        <button class="nav-item" data-view="health" title="健康防疫"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 5.8a5.5 5.5 0 0 0-7.8 0L12 6.9l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z"/><path d="M7 13h3l1.2-3 2 6 1.2-3H18"/></svg></span><span>健康防疫</span><em class="danger">3</em></button>
        <button class="nav-item" data-view="breeding" title="良种繁育"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M12 6v5M6 17v-3h12v3M12 11v3"/></svg></span><span>良种繁育</span></button>
        <button class="nav-item" data-view="environment" title="环境设备"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 14.8V5a4 4 0 0 0-8 0v9.8a6 6 0 1 0 8 0Z"/><path d="M10 8v9"/><path d="M17 7c1.3-1 2.7-1 4 0M17 11c1.3-1 2.7-1 4 0"/></svg></span><span>环境设备</span><em class="warn">2</em></button>
        <button class="nav-item" data-view="trace" title="采茸追溯"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="m7.3 10.8 9.4-4.6M7.3 13.2l9.4 4.6"/></svg></span><span>采茸追溯</span></button>
        <button class="nav-item" data-view="quality" title="质量库存"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="m3 7 9 4 9-4v10l-9 4-9-4V7Z"/><path d="M12 11v10M8 5l9 4"/></svg></span><span>质量库存</span><em class="danger">1</em></button>
        <button class="nav-item" data-view="assets" title="资产经营"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 13h5M5 6V4h13v2"/><circle cx="17" cy="13" r=".8" fill="currentColor" stroke="none"/></svg></span><span>资产经营</span></button>
        <button class="nav-item" data-view="farmers" title="农户服务"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21v-9l9-7 9 7v9"/><path d="M9 21v-6h6v6"/><circle cx="7" cy="6" r="2"/><path d="M4 10V8c0-1.1.9-2 2-2"/></svg></span><span>农户服务</span></button>
        <button class="nav-item" data-view="analytics" title="管理分析"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/><path d="m4 7 6-4 6 7 5-5"/></svg></span><span>管理分析</span></button>
        <div class="nav-section">平台能力</div>
        <button class="nav-item" data-view="foundation" title="技术底座"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg></span><span>技术底座</span></button>
      </nav>

      <div class="sidebar-foot">
        <button class="ghost-button" data-action="tour">演示导览</button>
        <button class="icon-button" data-action="reset" title="重置演示数据" aria-label="重置演示数据">↺</button>
      </div>
    </aside>

    <div class="app-body">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-button" id="menu-button" aria-label="打开导航" aria-expanded="false">☰</button>
          <div class="breadcrumb">
            <span>蒙阴·玉皇山良种繁育基地</span>
            <b id="current-title">综合大屏</b>
          </div>
        </div>
        <div class="topbar-center">
          <label class="global-search">
            <span aria-hidden="true">⌕</span>
            <input id="global-search" type="search" placeholder="搜索鹿号、批次、农户、订单" autocomplete="off">
            <kbd>⌘ K</kbd>
          </label>
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <div class="topbar-right">
          <button class="sync-pill" data-action="sync-detail">
            <i></i><span>中心已同步</span><small>09:42</small>
          </button>
          <button class="scenario-switch" data-action="scenario">
            <span>容量情景</span><b id="scenario-label">800 头</b>
          </button>
          <button class="profile" data-action="profile" aria-label="当前用户：系统管理员">
            <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.6 2.8 8 7 10 4.2-2 7-5.4 7-10V6l-7-3Z"/><circle cx="12" cy="10" r="2.2"/><path d="M8.5 16c.7-1.6 1.9-2.4 3.5-2.4s2.8.8 3.5 2.4"/></svg></span><div><b>系统管理员</b><small>管理视图</small></div>
          </button>
        </div>
      </header>

      <main id="app-main" class="main-content" tabindex="-1"></main>
      <footer class="app-footer">
        <span>V2 高保真原型 · 数据均为固定模拟样例 · 不代表已建成、已验收或已获监管认可</span>
        <span id="clock">2026-09-29 09:42:18</span>
      </footer>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="详情面板">
    <div class="drawer-head">
      <div><span id="drawer-kicker">详情</span><h2 id="drawer-title">业务详情</h2></div>
      <button class="close-button" data-action="close-drawer" aria-label="关闭详情">×</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>

  <div class="modal-wrap" id="modal" hidden aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div><span id="modal-kicker">确认操作</span><h2 id="modal-title">操作确认</h2></div>
        <button class="close-button" data-action="close-modal" aria-label="关闭对话框">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </section>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/views.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
